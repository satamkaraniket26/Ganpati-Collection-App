<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recovery Collection</title>

<link rel="stylesheet" href="style.css">

</head>

<body onload="checkLogin();loadPendingRecovery();">

<div class="app-layout">

<div class="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- Sidebar -->

<aside class="sidebar">

<div class="sidebar-logo">

<img src="logo.png">

<h2>Ganesh Collection</h2>

</div>

<nav>

<a href="home.html">Home</a>

<a href="grand-dashboard.html">Grand Dashboard</a>

<button class="dropdown-btn">

Reports ▼

</button>

<div class="dropdown-container">

<a href="daily-report.html">Daily Report</a>

<a href="society-summary.html">Society Summary</a>

<a href="universal-search.html">Universal Search</a>

<a href="export.html">Export</a>

</div>

<a href="receipt-lookup.html">Receipt Lookup</a>

<a href="volunteer-dashboard.html">Volunteer Dashboard</a>

</nav>

</aside>

<!-- Main -->

<main class="main-content">

<div class="topbar">

<button class="menu-btn" onclick="toggleSidebar()">

☰

</button>

<h2>Recovery Collection</h2>

<div id="welcomeUser"></div>

</div>

<div class="page-header">

<h2>Pending Recoveries</h2>

<p>Select any pending donor and recover the amount.</p>

</div>

<!-- Pending List -->

<div class="content-card">

<div class="card-section">

<div class="section-heading">

Pending List

</div>

<div id="pendingRecoveryList">

<div style="padding:30px;text-align:center">

Loading...

</div>

</div>

</div>

</div>

<!-- Recovery Form -->

<div class="content-card"

id="recoveryForm"

style="display:none;">

<div class="card-section">

<div class="section-heading">

Recovery Details

</div>

<div class="form-grid">

<div class="form-group">

<label>Building</label>

<input id="building" readonly>

</div>

<div class="form-group">

<label>Wing</label>

<input id="wing" readonly>

</div>

<div class="form-group">

<label>Room Number</label>

<input id="roomNo" readonly>

</div>

<div class="form-group">

<label>Donor Name</label>

<input id="donorName" readonly>

</div>

<div class="form-group">

<label>Mobile</label>

<input id="mobile" readonly>

</div>

<div class="form-group">

<label>Expected Amount</label>

<input id="expectedAmount" readonly>

</div>

<div class="form-group">

<label>Recovered Amount</label>

<input
id="recoveredAmount"
type="number"
placeholder="Enter Amount">

</div>

<div class="form-group">

<label>Payment Mode</label>

<select id="paymentMode">

<option value="">Select</option>

<option>Cash</option>

<option>UPI</option>

</select>

</div>

<input
type="hidden"
id="status"
value="Paid">

</div>

</div>

<div class="card-section">

<label>

<input
type="checkbox"
id="sendWhatsapp"
checked>

Send WhatsApp Receipt

</label>

</div>

<div class="button-row">

<button
class="secondary-btn"
onclick="location.href='home.html'">

Cancel

</button>

<button
id="saveBtn"
class="primary-btn"
onclick="saveRecovery()">

Save Recovery

</button>

</div>

</div>

</main>

</div>

<div
id="loadingOverlay"
class="loading-overlay">

<div class="loading-box">

<div class="loader"></div>

<h3 id="loadingText">

Please Wait...

</h3>

<p>

Processing Request

</p>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="app.js"></script>

</body>

</html>
